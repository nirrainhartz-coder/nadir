<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>נדיר • הוסט</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020816;color:#e8f6ff;font-family:system-ui,Arial,sans-serif}
canvas{position:fixed;inset:0}
.hud{position:fixed;left:0;right:0;pointer-events:none;text-align:center;text-shadow:0 2px 10px #000c,0 0 3px #000}
#top{top:18px}
.cat{color:#5fe;font:700 18px monospace;letter-spacing:2px}
.title{font-size:clamp(28px,4.5vw,64px);font-weight:900;text-shadow:0 0 24px #0cf8;margin:4px 0}
.timer{font:900 56px monospace;color:#7bed9f;text-shadow:0 0 18px #7bed9f}
.sub{font-size:20px;opacity:.8}
#lobby{top:50%;transform:translateY(-50%);background:#020816cc;padding:28px 0;border-block:2px solid #5fe5}
#lobby .logo{font-size:min(14vw,150px);font-weight:900;color:#7bf;text-shadow:0 0 40px #0cf,0 0 8px #fff}
.url{display:inline-block;font:900 clamp(24px,3.2vw,44px) monospace;direction:ltr;background:#0008;border:2px solid #5fe;border-radius:12px;padding:10px 24px;margin:12px 0;color:#7bed9f;text-shadow:0 0 12px #7bed9f}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin:16px auto}
.chip{padding:8px 18px;border-radius:30px;font-weight:800;font-size:22px;color:#012;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
button{pointer-events:auto;font:900 24px system-ui;padding:14px 44px;border-radius:12px;border:2px solid #7bed9f;background:#0b2a22;color:#7bed9f;cursor:pointer;box-shadow:0 0 20px #7bed9f55}
button:hover{background:#12483a}
#ctl{bottom:26px}
#zoomtxt{bottom:9%;font-size:clamp(30px,5vw,70px);font-weight:900;color:#ffe66d;text-shadow:0 0 30px #fc4;display:none}
#podium{position:fixed;inset:0;background:#020816f7;display:none;flex-direction:column;align-items:center;justify-content:center}
#podium h1{font-size:60px;margin:0 0 20px;color:#ffe66d;text-shadow:0 0 30px #fc4}
.pods{display:flex;align-items:flex-end;gap:14px;direction:ltr;height:50vh}
.pod{width:min(24vw,240px);text-align:center;display:flex;flex-direction:column;justify-content:flex-end}
.pod .nm{font-size:30px;font-weight:900;margin-bottom:4px}.pod .dp{font:700 20px monospace;margin-bottom:8px;color:#5fe}
.pod .bar{height:0;border-radius:10px 10px 0 0;transition:height 1.6s cubic-bezier(.2,1.2,.3,1);display:flex;align-items:flex-start;justify-content:center;font-size:56px;font-weight:900;color:#0006;padding-top:10px}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="top"></div>
<div class="hud" id="lobby"></div>
<div class="hud" id="zoomtxt"></div>
<div class="hud" id="ctl"></div>
<div id="podium"></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
function rs(){cv.width=innerWidth;cv.height=innerHeight}onresize=rs;rs();
let S={phase:'lobby',players:[]},off=0,D={},cam={top:-250,rng:900},Z={z:1,x:innerWidth/2,y:innerHeight/2},bub=[],conf=[],url='',podDone=false;
fetch('/info').then(r=>r.json()).then(i=>{const local=['localhost','127.0.0.1'].includes(location.hostname);url=local&&i.ips.length?`http://${i.ips[0]}:${i.port}/play`:location.origin+'/play';render()});
const es=new EventSource('/events?role=host');
es.onmessage=e=>{S=JSON.parse(e.data);off=S.now-Date.now();render()};
const post=a=>fetch('/host',{method:'POST',body:JSON.stringify({action:a})});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){if(S.phase==='lobby')post('start');else if(S.phase==='reveal')post('next')}});
const TC={c:'#9bd',m:'#7bed9f',r:'#c78bff',l:'#ffd24a'},TL={c:'נפוץ',m:'בינוני',r:'נדיר',l:'אגדי'};
const sorted=()=>[...S.players].sort((a,b)=>b.score-a.score);

function render(){
  const p=S.phase,n=S.players.length;
  $('lobby').style.display=p==='lobby'?'block':'none';
  if(p==='lobby'){
    $('lobby').innerHTML=`<div class="logo">נדיר</div><div class="sub">הצטרפו מהטלפון — פתחו את הכתובת:</div><div class="url">${url||'...'}</div>
    <div class="chips">${S.players.map(x=>`<div class="chip" style="background:${x.color}">${esc(x.name)}</div>`).join('')||'<div class="sub">מחכים לשחקנים...</div>'}</div>
    ${n?'<button onclick="post(\'start\')">התחילו ▼</button>':''}`;
    $('top').innerHTML='';$('ctl').innerHTML='';
  }
  if(p==='question'||p==='reveal'){
    $('top').innerHTML=`<div class="cat">שאלה ${S.q+1}/${S.total} • ${S.cat}</div><div class="title">${S.title}</div><div class="timer" id="tm"></div><div class="sub" id="ans"></div>`;
    $('ctl').innerHTML=p==='reveal'?`<button onclick="post('next')">${S.q<S.total-1?'לשאלה הבאה ▼':'למנצח! 🏆'}</button>`:'';
  }
  const z=p==='zoom';$('zoomtxt').style.display=z?'block':'none';
  if(z||p==='podium'){$('top').innerHTML='';$('ctl').innerHTML='';
    const w=sorted()[0];if(z&&w)$('zoomtxt').innerHTML=`🏆 ${esc(w.name)}<div class="sub">צלל הכי עמוק — ${w.score*10} מטר</div>`}
  $('podium').style.display=p==='podium'?'flex':'none';
  if(p==='podium'&&!podDone){podDone=true;buildPodium()}
  if(p!=='podium')podDone=false;
}
function buildPodium(){
  const s=sorted().slice(0,3),h=[260,360,200],ord=[1,0,2],cl=['#ffd24a','#cfd8e3','#d99a5b'],md=['🥇','🥈','🥉'];
  $('podium').innerHTML=`<h1>🏆 הפודיום 🏆</h1><div class="pods">${ord.filter(i=>s[i]).map(i=>`<div class="pod"><div class="nm" style="color:${s[i].color}">${esc(s[i].name)}</div><div class="dp">${s[i].score*10} מ'</div><div class="bar" data-h="${[260,200,150][i]}" style="background:${cl[i]};transition-delay:${(2-i)*0.7}s">${i+1}</div></div>`).join('')}</div>
  <div style="margin-top:24px"><button onclick="post('reset')">משחק חדש</button></div>`;
  setTimeout(()=>document.querySelectorAll('.bar').forEach(b=>b.style.height=b.dataset.h+'px'),100);
  for(let i=0;i<160;i++)conf.push({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,v:2+Math.random()*4,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*7,r:Math.random()*6})
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ----- ציור -----
const SP=["....hhhh....","...hhhhhh...","..hhvvvvhh..","..hhvvvvhh..","...hhhhhh...","..bbbbbbbb..",".bbbbbbbbbb.",".bbbbbbbbbb.","..bbbbbbbb..","..bb....bb.."];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const dcol=d=>{const t=Math.min(1,Math.max(0,d/3500));return `rgb(${mix([30,150,210],[2,8,22],Math.pow(t,.7)).join(',')})`};
function diver(x,y,px,color,t,i){
  const bob=Math.sin(t/450+i*1.7)*5,kick=Math.floor(t/260+i)%2;
  g.save();g.translate(x-6*px,y+bob-5*px);
  SP.forEach((row,r)=>[...row].forEach((c,k)=>{if(c==='.')return;g.fillStyle=c==='h'?'#e8f6ff':c==='v'?'#0a2a3a':color;g.fillRect(k*px,r*px,px,px)}));
  g.fillStyle='#223';[kick?[1,10]:[0,10],kick?[8,10]:[9,10]].forEach(([a,b])=>g.fillRect(a*px+px,b*px,px*2,px));
  g.fillStyle='#ffd24a';g.fillRect(-px,5*px,px,px*3);
  g.restore();
}
function pill(txt,x,y,bg,fg,fs){
  g.font=`800 ${fs}px system-ui`;const w=g.measureText(txt).width+22;g.fillStyle=bg;
  g.beginPath();g.roundRect(x-w/2,y-fs,w,fs*1.7,10);g.fill();g.fillStyle=fg;g.textAlign='center';g.fillText(txt,x,y+fs*.3);
}
function frame(t){
  const W=cv.width,H=cv.height,P=S.players,n=P.length;
  P.forEach(p=>{const d=D[p.id]||(D[p.id]={cur:p.score*10}),df=p.score*10-d.cur;d.cur+=Math.abs(df)<.5?df:Math.sign(df)*Math.max(Math.abs(df)*.022,.9)});
  const ds=P.map(p=>D[p.id].cur),mn=n?Math.min(...ds):0,mx=n?Math.max(...ds):0;
  const tt=Math.max(-250,mn-320),tr=Math.max(900,mx+520-tt);cam.top+=(tt-cam.top)*.05;cam.rng+=(tr-cam.rng)*.05;
  const Y=d=>(d-cam.top)/cam.rng*H;
  // זום על המנצח
  const w=S.phase==='zoom'||S.phase==='podium'?sorted()[0]:null;
  let tz=1,fx=W/2,fy=H/2;
  if(w){const i=P.findIndex(p=>p.id===w.id);fx=W*(i+1)/(n+1);fy=Y(D[w.id].cur);tz=3.4}
  Z.z+=(tz-Z.z)*.03;Z.x+=(fx-Z.x)*.05;Z.y+=(fy-Z.y)*.05;
  g.save();g.clearRect(0,0,W,H);
  g.translate(W/2,H/2);g.scale(Z.z,Z.z);g.translate(-Z.x,-Z.y);
  const x0=-W,wd=W*3;
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,dcol(cam.top));gr.addColorStop(1,dcol(cam.top+cam.rng));
  g.fillStyle=gr;g.fillRect(x0,-H,wd,H*3);
  const y0=Y(0);
  if(y0>-H){g.fillStyle='#4aa3dd';g.fillRect(x0,-H,wd,y0+H);g.fillStyle='#ffe9a8';g.beginPath();g.arc(W*.85,y0-90,50,0,7);g.fill();
    g.fillStyle='#2f8fd0';g.beginPath();g.moveTo(x0,y0);for(let x=x0;x<=x0+wd;x+=20)g.lineTo(x,y0+Math.sin(x/40+t/300)*6);g.lineTo(x0+wd,y0+30);g.lineTo(x0,y0+30);g.fill()}
  // סרגל עומק
  const st=cam.rng>2200?500:cam.rng>1100?200:100;g.textAlign='left';g.font='700 15px monospace';
  for(let d=Math.max(100,Math.ceil(cam.top/st)*st);d<cam.top+cam.rng;d+=st){const y=Y(d);g.strokeStyle='#ffffff18';g.setLineDash([8,10]);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);g.fillStyle='#bfe8ffaa';g.fillText(d+' מ\'',14,y-6)}
  // בועות
  if(bub.length<70)bub.push({x:Math.random()*W,y:H+10,v:.5+Math.random()*1.5,r:1+Math.random()*3});
  bub.forEach(b=>{b.y-=b.v;b.x+=Math.sin(b.y/30)*.4;if(b.y<-10){b.y=H+10;b.x=Math.random()*W}g.strokeStyle='#ffffff55';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.stroke()});
  // צוללנים
  const px=Math.max(3,Math.min(6,Math.floor(W/(n+1)/22)));
  P.forEach((p,i)=>{
    const x=W*(i+1)/(n+1),y=Y(D[p.id].cur);g.globalAlpha=S.phase==='lobby'?.35:w&&w.id!==p.id?.18:1;
    if(Math.random()<.04)bub.push({x:x+px*3,y:y-px*5,v:1.2,r:2});
    diver(x,y,px,p.color,t,i);
    if(!w)pill(p.name,x,y-px*8,p.color,'#012',Math.max(16,px*4));
    if(!w){g.font=`700 ${Math.max(13,px*3)}px monospace`;g.textAlign='center';g.fillStyle='#fff';g.fillText(Math.round(D[p.id].cur)+' מ\'',x,y+px*10)}
    if(S.phase==='question'&&p.answered)pill('✔ ענה',x,y+px*14,'#0b3a2a','#7bed9f',px*3.4);
    if((S.phase==='reveal')&&p.last){const l=p.last;
      if(l.answer){pill(`${l.answer}  +${l.pts}`,x,y+px*14,'#000a',TC[l.tier],px*3.6);
        pill(TL[l.tier]+(l.uniq?' • ייחודי!':l.shared?' • משותף':''),x,y+px*18.5,TC[l.tier],'#012',px*3)}
      else pill('לא ענה',x,y+px*14,'#000a','#889',px*3.4)}
    g.globalAlpha=1});
  g.restore();
  // קונפטי
  if(S.phase==='podium')conf.forEach(c=>{c.y+=c.v;c.r+=.1;if(c.y>H)c.y=-10;g.fillStyle=c.c;g.fillRect(c.x+Math.sin(c.r)*20,c.y,c.s,c.s*.6)});
  // טיימר
  const tm=$('tm');if(tm&&S.phase==='question'){const now=Date.now()+off;
    if(now<S.startsAt){tm.textContent=Math.ceil((S.startsAt-now)/1000);tm.style.color='#ffe66d'}
    else{const s=Math.max(0,Math.ceil((S.endsAt-now)/1000));tm.textContent=s;tm.style.color=s<=5?'#ff5d73':'#7bed9f'}
    $('ans').textContent=`ענו ${P.filter(p=>p.answered).length} מתוך ${n}`}
  else if(tm){tm.textContent='';$('ans').textContent=''}
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script></body></html>
